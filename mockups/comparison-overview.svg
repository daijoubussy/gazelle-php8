<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { fill: #f0f6fc; font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; }
      .subtitle { fill: #8b949e; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; }
      .section-title { fill: #f0f6fc; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .label { fill: #8b949e; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
      .feature-text { fill: #c9d1d9; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
      .feature-highlight { fill: #58a6ff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
      .old-box { fill: #1a1a2e; }
      .new-box { fill: #16213e; }
      .border { stroke: #30363d; stroke-width: 1; fill: none; }
      .old-text { fill: #e0e0e0; font-family: Verdana, sans-serif; font-size: 10px; }
      .old-link { fill: #5dade2; font-family: Verdana, sans-serif; font-size: 10px; }
      .new-text { fill: #c9d1d9; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 11px; }
      .new-link { fill: #58a6ff; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 11px; }
      .check { fill: #3fb950; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; }
      .neutral { fill: #d29922; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; }
      .arrow { fill: #58a6ff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; }
      .bg { fill: #0d1117; }
      .card-bg { fill: #161b22; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" class="bg"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" class="title">Gazelle UI Evolution</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">Modernizing the community experience while preserving the Gazelle identity</text>

  <!-- OLD UI Section -->
  <text x="300" y="120" text-anchor="middle" class="label">BEFORE (Legacy PHP)</text>

  <!-- Old UI Preview Box -->
  <rect x="50" y="140" width="500" height="300" rx="8" class="old-box"/>
  <rect x="50" y="140" width="500" height="300" rx="8" class="border"/>

  <!-- Mini Old UI -->
  <rect x="60" y="150" width="480" height="30" fill="#16213e"/>
  <text x="75" y="170" fill="#fff" font-family="Verdana" font-size="10" font-weight="bold">GAZELLE</text>
  <text x="150" y="170" class="old-link">Home</text>
  <text x="190" y="170" class="old-link">Torrents</text>
  <text x="250" y="170" class="old-link">Forums</text>

  <rect x="60" y="190" width="230" height="80" fill="#16213e" stroke="#333"/>
  <text x="70" y="210" class="old-text">Site Stats</text>
  <text x="70" y="230" fill="#999" font-family="Verdana" font-size="9">Users: 12,456</text>
  <text x="70" y="245" fill="#999" font-family="Verdana" font-size="9">Torrents: 89,234</text>
  <text x="70" y="260" fill="#999" font-family="Verdana" font-size="9">Ratio: 4.08</text>

  <rect x="300" y="190" width="230" height="80" fill="#16213e" stroke="#333"/>
  <text x="310" y="210" class="old-text">Recent Uploads</text>
  <text x="310" y="230" class="old-link" font-size="9">Artist - Album [FLAC]</text>
  <text x="310" y="245" class="old-link" font-size="9">Band - EP [MP3]</text>

  <rect x="60" y="280" width="470" height="150" fill="#1e2a38" stroke="#333"/>
  <rect x="60" y="280" width="470" height="20" fill="#2c3e50"/>
  <text x="70" y="294" fill="#fff" font-family="Verdana" font-size="9">Torrent List</text>
  <text x="70" y="315" class="old-link" font-size="9">[Music] Artist - Album Title (2025) [FLAC/Log]</text>
  <text x="400" y="315" fill="#27ae60" font-family="Verdana" font-size="9">24</text>
  <text x="430" y="315" fill="#e74c3c" font-family="Verdana" font-size="9">3</text>
  <text x="70" y="335" class="old-link" font-size="9">[Music] Band - Greatest Hits [MP3/320]</text>
  <text x="400" y="335" fill="#27ae60" font-family="Verdana" font-size="9">18</text>
  <text x="430" y="335" fill="#e74c3c" font-family="Verdana" font-size="9">2</text>

  <!-- Arrow -->
  <text x="585" y="310" text-anchor="middle" class="arrow">→</text>

  <!-- NEW UI Section -->
  <text x="900" y="120" text-anchor="middle" class="label">AFTER (Modern Components)</text>

  <!-- New UI Preview Box -->
  <rect x="650" y="140" width="500" height="300" rx="8" class="new-box"/>
  <rect x="650" y="140" width="500" height="300" rx="8" class="border"/>

  <!-- Mini New UI - Same dark theme! -->
  <rect x="660" y="150" width="480" height="35" fill="#0f0f1a"/>
  <text x="680" y="174" fill="#58a6ff" font-family="'Segoe UI'" font-size="14" font-weight="bold">GAZELLE</text>
  <text x="780" y="172" class="new-link" font-size="11">Home</text>
  <text x="820" y="172" class="new-link" font-size="11">Torrents</text>
  <text x="880" y="172" class="new-link" font-size="11">Forums</text>
  <rect x="1040" y="158" width="80" height="20" rx="4" fill="#0d1117" stroke="#30363d"/>

  <!-- Stats Cards -->
  <rect x="670" y="195" width="110" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="680" y="215" fill="#8b949e" font-family="'Segoe UI'" font-size="9">Uploaded</text>
  <text x="680" y="238" fill="#3fb950" font-family="'Segoe UI'" font-size="14" font-weight="600">524 GB</text>

  <rect x="790" y="195" width="110" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="800" y="215" fill="#8b949e" font-family="'Segoe UI'" font-size="9">Ratio</text>
  <text x="800" y="238" fill="#3fb950" font-family="'Segoe UI'" font-size="14" font-weight="600">4.08</text>

  <rect x="910" y="195" width="110" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="920" y="215" fill="#8b949e" font-family="'Segoe UI'" font-size="9">Points</text>
  <text x="920" y="238" fill="#f0c14b" font-family="'Segoe UI'" font-size="14" font-weight="600">15,432</text>

  <!-- Data Card -->
  <rect x="670" y="260" width="470" height="170" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="685" y="282" fill="#f0f6fc" font-family="'Segoe UI'" font-size="12" font-weight="600">Recent Uploads</text>
  <text x="1105" y="282" fill="#58a6ff" font-family="'Segoe UI'" font-size="10" text-anchor="end">View All →</text>

  <rect x="680" y="295" width="450" height="22" rx="4" fill="#21262d"/>
  <text x="690" y="311" fill="#6e7681" font-family="'Segoe UI'" font-size="9">Release</text>
  <text x="960" y="311" fill="#6e7681" font-family="'Segoe UI'" font-size="9">S</text>
  <text x="1000" y="311" fill="#6e7681" font-family="'Segoe UI'" font-size="9">L</text>

  <rect x="690" y="325" width="24" height="24" rx="4" fill="#2d3a5a"/>
  <text x="720" y="340" fill="#58a6ff" font-family="'Segoe UI'" font-size="10">Artist - Album Title (2025)</text>
  <rect x="880" y="330" width="35" height="14" rx="3" fill="#388bfd26" stroke="#388bfd"/>
  <text x="897" y="340" text-anchor="middle" fill="#58a6ff" font-size="8">FLAC</text>
  <text x="960" y="340" fill="#3fb950" font-family="'Segoe UI'" font-size="10">24</text>
  <text x="1000" y="340" fill="#f85149" font-family="'Segoe UI'" font-size="10">3</text>

  <rect x="690" y="360" width="24" height="24" rx="4" fill="#2d3a5a"/>
  <text x="720" y="375" fill="#58a6ff" font-family="'Segoe UI'" font-size="10">Band - Greatest Hits</text>
  <rect x="840" y="365" width="35" height="14" rx="3" fill="#388bfd26" stroke="#388bfd"/>
  <text x="857" y="375" text-anchor="middle" fill="#58a6ff" font-size="8">MP3</text>
  <text x="960" y="375" fill="#3fb950" font-family="'Segoe UI'" font-size="10">18</text>
  <text x="1000" y="375" fill="#f85149" font-family="'Segoe UI'" font-size="10">2</text>

  <!-- Key Principles -->
  <text x="600" y="490" text-anchor="middle" class="section-title">Design Principles</text>

  <!-- Principle Cards -->
  <rect x="50" y="510" width="350" height="100" rx="8" class="card-bg"/>
  <rect x="50" y="510" width="350" height="100" rx="8" class="border"/>
  <text x="70" y="540" class="feature-highlight" font-weight="600">Preserve Dark Theme</text>
  <text x="70" y="565" class="feature-text">Keep the signature dark color scheme</text>
  <text x="70" y="585" class="feature-text">that Gazelle communities love.</text>

  <rect x="425" y="510" width="350" height="100" rx="8" class="card-bg"/>
  <rect x="425" y="510" width="350" height="100" rx="8" class="border"/>
  <text x="445" y="540" class="feature-highlight" font-weight="600">Information Density</text>
  <text x="445" y="565" class="feature-text">Maintain the data-rich layouts that</text>
  <text x="445" y="585" class="feature-text">power users expect and need.</text>

  <rect x="800" y="510" width="350" height="100" rx="8" class="card-bg"/>
  <rect x="800" y="510" width="350" height="100" rx="8" class="border"/>
  <text x="820" y="540" class="feature-highlight" font-weight="600">Community Focus</text>
  <text x="820" y="565" class="feature-text">Forums, requests, and social features</text>
  <text x="820" y="585" class="feature-text">remain front and center.</text>

  <!-- Improvements Table -->
  <text x="600" y="650" text-anchor="middle" class="section-title">What's Improved</text>

  <rect x="100" y="670" width="1000" height="200" rx="8" class="card-bg"/>
  <rect x="100" y="670" width="1000" height="200" rx="8" class="border"/>

  <!-- Table Header -->
  <rect x="100" y="670" width="1000" height="35" rx="8 8 0 0" fill="#21262d"/>
  <text x="300" y="693" text-anchor="middle" class="label">Improvement</text>
  <text x="700" y="693" text-anchor="middle" class="label">Benefit</text>

  <!-- Row 1 -->
  <line x1="100" y1="710" x2="1100" y2="710" stroke="#30363d"/>
  <text x="130" y="732" class="feature-text">Modern component library (Splunk UI)</text>
  <text x="520" y="732" class="feature-text">Consistent, accessible UI patterns</text>
  <text x="520" y="750" class="check">✓ Works with dark themes</text>

  <!-- Row 2 -->
  <line x1="100" y1="765" x2="1100" y2="765" stroke="#30363d"/>
  <text x="130" y="787" class="feature-text">TypeScript + React architecture</text>
  <text x="520" y="787" class="feature-text">Type safety, better developer experience</text>
  <text x="520" y="805" class="check">✓ Easier to maintain and extend</text>

  <!-- Row 3 -->
  <line x1="100" y1="820" x2="1100" y2="820" stroke="#30363d"/>
  <text x="130" y="842" class="feature-text">Improved visual hierarchy</text>
  <text x="520" y="842" class="feature-text">Clearer tags, badges, and status indicators</text>
  <text x="520" y="860" class="check">✓ Same info, easier to scan</text>
</svg>
