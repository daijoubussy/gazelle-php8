<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { fill: #1a1f36; font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; }
      .subtitle { fill: #6b7280; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; }
      .section-title { fill: #374151; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .label { fill: #9ca3af; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
      .feature-text { fill: #3c4257; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
      .old-box { fill: #1a1a2e; }
      .new-box { fill: #ffffff; }
      .border { stroke: #e5e7eb; stroke-width: 1; fill: none; }
      .old-text { fill: #e0e0e0; font-family: Verdana, sans-serif; font-size: 10px; }
      .old-link { fill: #5dade2; font-family: Verdana, sans-serif; font-size: 10px; }
      .new-text { fill: #3c4257; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .new-link { fill: #0070d2; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .check { fill: #10b981; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; }
      .cross { fill: #ef4444; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; }
      .arrow { fill: #0070d2; font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" class="title">Gazelle UI Modernization</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">Comparison: Legacy PHP vs Modern Splunk UI Toolkit</text>

  <!-- OLD UI Section -->
  <text x="300" y="120" text-anchor="middle" class="label">BEFORE (Legacy PHP)</text>

  <!-- Old UI Preview Box -->
  <rect x="50" y="140" width="500" height="300" rx="8" class="old-box"/>
  <rect x="50" y="140" width="500" height="300" rx="8" class="border"/>

  <!-- Mini Old UI -->
  <rect x="60" y="150" width="480" height="30" fill="#16213e"/>
  <text x="75" y="170" fill="#fff" font-family="Verdana" font-size="10" font-weight="bold">GAZELLE</text>
  <text x="150" y="170" class="old-link">Home</text>
  <text x="190" y="170" class="old-link">Torrents</text>
  <text x="250" y="170" class="old-link">Forums</text>

  <rect x="60" y="190" width="230" height="80" fill="#16213e" stroke="#333"/>
  <text x="70" y="210" class="old-text">Site Stats</text>
  <text x="70" y="230" fill="#999" font-family="Verdana" font-size="9">Users: 12,456</text>
  <text x="70" y="245" fill="#999" font-family="Verdana" font-size="9">Torrents: 89,234</text>
  <text x="70" y="260" fill="#999" font-family="Verdana" font-size="9">Ratio: 4.08</text>

  <rect x="300" y="190" width="230" height="80" fill="#16213e" stroke="#333"/>
  <text x="310" y="210" class="old-text">Recent Uploads</text>
  <text x="310" y="230" class="old-link" font-size="9">Artist - Album [FLAC]</text>
  <text x="310" y="245" class="old-link" font-size="9">Band - EP [MP3]</text>

  <rect x="60" y="280" width="470" height="150" fill="#1e2a38" stroke="#333"/>
  <rect x="60" y="280" width="470" height="20" fill="#2c3e50"/>
  <text x="70" y="294" fill="#fff" font-family="Verdana" font-size="9">Torrent List</text>
  <text x="70" y="315" class="old-link" font-size="9">[Music] Artist - Album Title (2025) [FLAC/Log]</text>
  <text x="400" y="315" fill="#27ae60" font-family="Verdana" font-size="9">24</text>
  <text x="430" y="315" fill="#e74c3c" font-family="Verdana" font-size="9">3</text>
  <text x="70" y="335" class="old-link" font-size="9">[Music] Band - Greatest Hits [MP3/320]</text>
  <text x="400" y="335" fill="#27ae60" font-family="Verdana" font-size="9">18</text>
  <text x="430" y="335" fill="#e74c3c" font-family="Verdana" font-size="9">2</text>

  <!-- Arrow -->
  <text x="585" y="310" text-anchor="middle" class="arrow">→</text>

  <!-- NEW UI Section -->
  <text x="900" y="120" text-anchor="middle" class="label">AFTER (Splunk UI Toolkit)</text>

  <!-- New UI Preview Box -->
  <rect x="650" y="140" width="500" height="300" rx="8" class="new-box"/>
  <rect x="650" y="140" width="500" height="300" rx="8" class="border"/>

  <!-- Mini New UI -->
  <rect x="650" y="140" width="50" height="300" fill="#1a1f36" rx="8 0 0 8"/>
  <circle cx="675" cy="165" r="12" fill="#2d3748"/>
  <text x="675" y="170" text-anchor="middle" fill="#fff" font-size="10">G</text>
  <circle cx="675" cy="205" r="8" fill="#0070d2"/>
  <circle cx="675" cy="235" r="8" fill="none" stroke="#a0aec0"/>
  <circle cx="675" cy="265" r="8" fill="none" stroke="#a0aec0"/>

  <rect x="710" y="150" width="430" height="35" fill="#fff"/>
  <rect x="720" y="158" width="150" height="20" rx="4" fill="#f4f5f7" stroke="#d1d5db"/>
  <text x="730" y="172" fill="#9ca3af" font-family="'Segoe UI'" font-size="9">Search...</text>

  <!-- Stats Cards -->
  <rect x="710" y="195" width="100" height="55" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <text x="720" y="212" fill="#6b7280" font-family="'Segoe UI'" font-size="8">Uploaded</text>
  <text x="720" y="235" fill="#1a1f36" font-family="'Segoe UI'" font-size="16" font-weight="bold">524 GB</text>

  <rect x="820" y="195" width="100" height="55" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <text x="830" y="212" fill="#6b7280" font-family="'Segoe UI'" font-size="8">Downloaded</text>
  <text x="830" y="235" fill="#1a1f36" font-family="'Segoe UI'" font-size="16" font-weight="bold">128 GB</text>

  <rect x="930" y="195" width="100" height="55" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <text x="940" y="212" fill="#6b7280" font-family="'Segoe UI'" font-size="8">Ratio</text>
  <text x="940" y="235" fill="#10b981" font-family="'Segoe UI'" font-size="16" font-weight="bold">4.08</text>

  <rect x="1040" y="195" width="90" height="55" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <text x="1050" y="212" fill="#6b7280" font-family="'Segoe UI'" font-size="8">Points</text>
  <text x="1050" y="235" fill="#1a1f36" font-family="'Segoe UI'" font-size="16" font-weight="bold">15,432</text>

  <!-- Data Card -->
  <rect x="710" y="260" width="420" height="170" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <text x="725" y="282" fill="#1a1f36" font-family="'Segoe UI'" font-size="12" font-weight="600">Recent Uploads</text>

  <rect x="720" y="295" width="400" height="20" rx="4" fill="#f9fafb"/>
  <text x="730" y="309" fill="#6b7280" font-family="'Segoe UI'" font-size="8">Release</text>
  <text x="930" y="309" fill="#6b7280" font-family="'Segoe UI'" font-size="8">Size</text>
  <text x="1000" y="309" fill="#6b7280" font-family="'Segoe UI'" font-size="8">S/L</text>

  <rect x="730" y="325" width="20" height="20" rx="2" fill="#dbeafe"/>
  <text x="755" y="338" fill="#0070d2" font-family="'Segoe UI'" font-size="9">Artist - Album Title (2025)</text>
  <text x="930" y="338" fill="#3c4257" font-family="'Segoe UI'" font-size="9">485 MB</text>
  <text x="1000" y="338" fill="#10b981" font-family="'Segoe UI'" font-size="9">24</text>
  <text x="1020" y="338" fill="#ef4444" font-family="'Segoe UI'" font-size="9">/3</text>

  <rect x="730" y="355" width="20" height="20" rx="2" fill="#dbeafe"/>
  <text x="755" y="368" fill="#0070d2" font-family="'Segoe UI'" font-size="9">Band - Greatest Hits</text>
  <text x="930" y="368" fill="#3c4257" font-family="'Segoe UI'" font-size="9">128 MB</text>
  <text x="1000" y="368" fill="#10b981" font-family="'Segoe UI'" font-size="9">18</text>
  <text x="1020" y="368" fill="#ef4444" font-family="'Segoe UI'" font-size="9">/2</text>

  <!-- Feature Comparison -->
  <text x="600" y="490" text-anchor="middle" class="section-title">Feature Comparison</text>

  <!-- Feature Table -->
  <rect x="100" y="510" width="1000" height="350" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- Table Header -->
  <rect x="100" y="510" width="1000" height="40" rx="8 8 0 0" fill="#f9fafb"/>
  <text x="300" y="535" text-anchor="middle" class="label">Feature</text>
  <text x="550" y="535" text-anchor="middle" class="label">Legacy Gazelle</text>
  <text x="850" y="535" text-anchor="middle" class="label">Splunk UI Toolkit</text>

  <!-- Row 1 -->
  <line x1="100" y1="560" x2="1100" y2="560" stroke="#e5e7eb"/>
  <text x="300" y="580" text-anchor="middle" class="feature-text">Design System</text>
  <text x="550" y="580" text-anchor="middle" class="feature-text">Custom CSS, inconsistent</text>
  <text x="850" y="580" text-anchor="middle" class="feature-text">Unified Splunk components</text>
  <text x="550" y="598" text-anchor="middle" class="cross">✗</text>
  <text x="850" y="598" text-anchor="middle" class="check">✓</text>

  <!-- Row 2 -->
  <line x1="100" y1="615" x2="1100" y2="615" stroke="#e5e7eb"/>
  <text x="300" y="635" text-anchor="middle" class="feature-text">Responsive Layout</text>
  <text x="550" y="635" text-anchor="middle" class="feature-text">Fixed width tables</text>
  <text x="850" y="635" text-anchor="middle" class="feature-text">Fully responsive grid</text>
  <text x="550" y="653" text-anchor="middle" class="cross">✗</text>
  <text x="850" y="653" text-anchor="middle" class="check">✓</text>

  <!-- Row 3 -->
  <line x1="100" y1="670" x2="1100" y2="670" stroke="#e5e7eb"/>
  <text x="300" y="690" text-anchor="middle" class="feature-text">Theming</text>
  <text x="550" y="690" text-anchor="middle" class="feature-text">Hard-coded colors</text>
  <text x="850" y="690" text-anchor="middle" class="feature-text">Theme provider + variables</text>
  <text x="550" y="708" text-anchor="middle" class="cross">✗</text>
  <text x="850" y="708" text-anchor="middle" class="check">✓</text>

  <!-- Row 4 -->
  <line x1="100" y1="725" x2="1100" y2="725" stroke="#e5e7eb"/>
  <text x="300" y="745" text-anchor="middle" class="feature-text">Icons</text>
  <text x="550" y="745" text-anchor="middle" class="feature-text">PNG images / Unicode</text>
  <text x="850" y="745" text-anchor="middle" class="feature-text">@splunk/react-icons SVG</text>
  <text x="550" y="763" text-anchor="middle" class="cross">✗</text>
  <text x="850" y="763" text-anchor="middle" class="check">✓</text>

  <!-- Row 5 -->
  <line x1="100" y1="780" x2="1100" y2="780" stroke="#e5e7eb"/>
  <text x="300" y="800" text-anchor="middle" class="feature-text">Accessibility</text>
  <text x="550" y="800" text-anchor="middle" class="feature-text">Limited ARIA support</text>
  <text x="850" y="800" text-anchor="middle" class="feature-text">WCAG 2.1 compliant</text>
  <text x="550" y="818" text-anchor="middle" class="cross">✗</text>
  <text x="850" y="818" text-anchor="middle" class="check">✓</text>

  <!-- Row 6 -->
  <text x="300" y="845" text-anchor="middle" class="feature-text">Type Safety</text>
  <text x="550" y="845" text-anchor="middle" class="feature-text">PHP templates</text>
  <text x="850" y="845" text-anchor="middle" class="feature-text">TypeScript + React</text>
  <text x="550" y="863" text-anchor="middle" class="cross">✗</text>
  <text x="850" y="863" text-anchor="middle" class="check">✓</text>
</svg>
